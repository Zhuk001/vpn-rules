name: Sync VPN Rules

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync rules
        shell: pwsh
        run: ./scripts/sync-rules.ps1

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules scripts/sync-rules.ps1
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync vpn rules"
            git push
          fi
